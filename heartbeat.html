<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heartbeat</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09070a;color:#fff;font-family:system-ui;text-align:center}.box{padding:50px;max-width:650px}.heart{font-size:110px;cursor:pointer;animation:p 1s infinite}.small{opacity:.65}#msg{margin:25px auto;min-height:50px;font:italic 20px Georgia;max-width:500px}@keyframes p{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}45%{transform:scale(1.16)}60%{transform:scale(1)}}</style></head><body><main class="box"><div class="small">A LITTLE EXPERIMENT</div><h1>Listen to the heartbeat.</h1><p class="small">Tap the heart and watch the rhythm change.</p><div class="heart" id="h">♥</div><div><span id="b">72</span> BPM</div><div id="msg"></div></main><script>const m=['Some moments stay with you.','Some questions are worth exploring.','Not everything needs an answer immediately.','Sometimes noticing is enough.','Maybe there is more to discover.'];let n=0;h.onclick=()=>{n++;b.textContent=Math.min(112,72+n*4);msg.textContent=m[(n-1)%m.length]}</script></body></html>
