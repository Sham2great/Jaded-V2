<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Letter That Writes Itself</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0709;color:#fff}
body{font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#4b1830 0,#170b13 38%,#060506 78%);z-index:-2}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle,#ffffff0b 1px,transparent 1px);background-size:42px 42px;opacity:.35;z-index:-1}
.wrap{width:min(850px,94vw);padding:25px}
.card{background:#fffaf5;color:#30242a;border-radius:5px;padding:55px 55px 48px;box-shadow:0 35px 100px #000b;position:relative;min-height:560px}
.card:before{content:"";position:absolute;inset:12px;border:1px solid #8b687522;pointer-events:none}
.top{font:600 9px system-ui;letter-spacing:4px;text-transform:uppercase;color:#98717f;text-align:center;margin-bottom:30px}
h1{font:italic 43px Georgia,serif;font-weight:400;margin:0 0 28px}
#letter{font:17px/2 Georgia,serif;white-space:pre-wrap;min-height:330px}
.cursor{display:inline-block;width:2px;height:20px;background:#8d536b;vertical-align:-3px;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.bottom{text-align:center;margin-top:20px;color:#a07d88;font:italic 13px Georgia}
button{margin-top:22px;border:1px solid #8b687255;background:transparent;border-radius:999px;padding:10px 19px;color:#76505f;cursor:pointer;font:600 10px system-ui;letter-spacing:2px}
@media(max-width:600px){.card{padding:40px 25px;min-height:620px}h1{font-size:34px}#letter{font-size:15px;line-height:1.85}}
</style>
</head>
<body>
<div class="wrap">
<section class="card">
<div class="top">A LETTER THAT WRITES ITSELF</div>
<h1>For Ayli ♡</h1>
<div id="letter"></div><span class="cursor"></span>
<div class="bottom" id="bottom">some things are easier to write than say</div>
<div><button id="restart">READ IT AGAIN</button></div>
</section>
</div>
<script>
const text = `Ayli,

I don't really know when you became someone I thought about this much.

Maybe it was the conversations. Maybe it was how easily we understood each other. Maybe it was simply the feeling that, somehow, meeting you made me wonder about a version of life I hadn't considered before.

I know I can't predict where any of this goes.

And I'm not trying to.

I just think there's something beautiful about meeting someone who makes you curious enough to wonder what could happen if you tried something different.

Maybe we'd surprise each other.
Maybe we'd learn something.
Maybe it wouldn't work at all.

But if there ever came a moment when trying was actually possible, I'd want to know what that moment felt like.

Not because I expect anything from you.

Just because, out of all the possibilities, you're the one that made me wonder.

And honestly...

I think that's worth writing down.`;

const el=document.getElementById('letter');
const restart=document.getElementById('restart');
let i=0,timer;

function write(){
 clearInterval(timer);
 el.textContent='';
 i=0;
 restart.style.display='none';
 timer=setInterval(()=>{
   el.textContent=text.slice(0,i++);
   if(i>text.length){
     clearInterval(timer);
     restart.style.display='inline-block';
   }
 },32);
}
restart.onclick=write;
write();
</script>
</body>
</html>
