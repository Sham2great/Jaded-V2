<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Letter That Writes Itself</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#080608;color:#2d2228;font-family:Georgia,serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#5b203d 0,#1b0d17 42%,#050405 82%);z-index:-3}
body:after{content:"";position:fixed;inset:0;background-image:radial-gradient(#fff2 1px,transparent 1px);background-size:42px 42px;opacity:.45;z-index:-2}
.page{min-height:100vh;padding:8vh 0 16vh;display:flex;justify-content:center}
.card{width:min(760px,92vw);background:#fffaf4;padding:55px 60px;box-shadow:0 30px 90px #000b;position:relative}
.card:before{content:"";position:absolute;inset:13px;border:1px solid #8c687522;pointer-events:none}
.label{text-align:center;font:600 10px system-ui;letter-spacing:4px;color:#9a7180;margin-bottom:25px}
h1{text-align:center;font:italic 42px Georgia,serif;font-weight:400;color:#8e315d;margin:0 0 34px}
#letter{font:17px/2 Georgia,serif;white-space:pre-wrap}
.cursor{display:inline-block;width:2px;height:19px;background:#8e315d;margin-left:2px;animation:blink .7s infinite;vertical-align:-3px}
@keyframes blink{50%{opacity:0}}
.bottom{text-align:center;color:#a27d89;font:italic 13px Georgia;margin-top:40px}
button{display:block;margin:22px auto 0;border:1px solid #a98492;background:transparent;border-radius:30px;padding:10px 18px;color:#76505f;font:600 10px system-ui;letter-spacing:2px;cursor:pointer}
.thoughts{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.thought{position:absolute;color:#fff;opacity:0;font:italic 14px/1.5 Georgia,serif;text-shadow:0 0 18px #d99ab6;animation:think 7s ease-in-out infinite}
.t1{left:5%;top:22%}.t2{right:6%;top:32%;animation-delay:1.5s}.t3{left:8%;bottom:25%;animation-delay:3s}.t4{right:7%;bottom:18%;animation-delay:4.5s}.t5{left:50%;top:8%;transform:translateX(-50%);animation-delay:2.2s}
@keyframes think{0%,100%{opacity:0;transform:translateY(10px)}18%,65%{opacity:.72;transform:translateY(0)}80%{opacity:0;transform:translateY(-8px)}}
@media(max-width:900px){.thought{display:none}}
@media(max-width:600px){.page{padding-top:5vh}.card{width:94vw;padding:40px 28px}h1{font-size:34px}#letter{font-size:15px;line-height:1.85}}
</style>
</head>
<body>
<div class="thoughts" aria-hidden="true">
<div class="thought t1">what if I'm overthinking this?</div>
<div class="thought t2">maybe I'm reading too much into it...</div>
<div class="thought t3">what if it could actually work?</div>
<div class="thought t4">maybe I should just stop wondering.</div>
<div class="thought t5">what if?</div>
</div>

<div class="page">
<main class="card">
<div class="label">A LETTER THAT WRITES ITSELF</div>
<h1>For Ayli ♡</h1>
<div id="letter"></div><span class="cursor"></span>
<div class="bottom">some things are easier to write than say</div>
<button id="again">READ IT AGAIN</button>
</main>
</div>

<script>
const text = `Ayli,

I don't really know when you became someone I thought about this much.

Maybe it was the conversations. Maybe it was how easily we understood each other. Maybe it was just meeting someone who made me look at love a little differently.

I know I can't predict where any of this goes.

And I'm not trying to.

I just think there is something beautiful about the possibility of trying something different. Meeting someone outside the usual expectations. Letting two people who understand each other see what could happen if they ever got the chance.

Maybe we'd surprise each other.
Maybe we'd learn something.
Maybe it wouldn't work at all.

But if there ever came a moment when trying was actually possible, I'd want to know what it felt like.

Not because I expect anything from you.
Not because I think something is owed to me.

Just because you are one of the few people who made me wonder.

And honestly...

I think some possibilities are worth writing down.`;

const letter=document.getElementById("letter");
const again=document.getElementById("again");
let i=0,timer,autoScroll;

function write(){
 clearInterval(timer);
 clearInterval(autoScroll);
 letter.textContent="";
 again.style.display="none";
 window.scrollTo(0,0);
 i=0;
 timer=setInterval(()=>{
   letter.textContent=text.slice(0,i++);
   if(i>text.length){
     clearInterval(timer);
     again.style.display="block";
     startAutoScroll();
   }
 },32);
}

function startAutoScroll(){
 let direction=1;
 autoScroll=setInterval(()=>{
   const max=document.documentElement.scrollHeight-window.innerHeight;
   if(max<=0)return;
   if(window.scrollY>=max-2) direction=-1;
   if(window.scrollY<=2) direction=1;
   window.scrollBy(0,direction*0.45);
 },30);
}

again.onclick=write;
write();
</script>
</body>
</html>
